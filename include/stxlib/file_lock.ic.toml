# Behavioural constraints of stxlib::FileLock (files.hpp), the IC
# declaration (template_harness docs/ic_declarations.md; STXlib's project
# file is tools/ic/project.toml). Edit this file, then run
#   python3 -B tools/ic_declarations.py generate --config tools/ic/project.toml
#
# States: released (default constructed, moved from or released) and held.
# held() observes them.

schema = 1
component = "FileLock"
namespace = "stxlib"
header = "include/stxlib/files.hpp"
anchor = "class FileLock final {"
keys = { manifest = "stxlib::FileLock" }
thread = "owner"
states = ["released", "held"]
initial = "released"
state_query = { call = "held", observes = { released = "false", held = "true" } }

[[call]]
name = "acquire"
kind = "static"
thread = "any"
declarations = ["[[nodiscard]] static OperationResult<FileLock> acquire(const Path& path, Duration timeout) noexcept;"]
fails = [
  { failure = "limit_exceeded", when = "busy: another holder kept the lock past timeout" },
  { failure = "not_found", when = "the lock file's directory is missing" },
  { failure = "permission_denied" },
  { failure = "out_of_memory", when = "the host name cannot be built" },
]
returns = { type = "FileLock", state = ["held"], owns = "caller" }

[[call]]
name = "release"
declarations = ["void release() noexcept;"]
in = ["held", "released"]
moves = "released"
