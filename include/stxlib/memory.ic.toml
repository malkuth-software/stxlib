# Behavioural constraints of stxlib::memory (memory.hpp), STXlib's allocator
# used by name, the IC declaration (template_harness docs/ic_declarations.md;
# STXlib's project file is tools/ic/project.toml). Edit this file, then run
#   python3 -B tools/ic_declarations.py generate --config tools/ic/project.toml
#
# The backend refuses: stx_minmallocpp by its own declaration
# (src/state/stx_minmallocpp/allocator.ic.toml), the host backend by the
# check generated here (src/state/allocator.cpp).

schema = 1
component = "memory"
namespace = "stxlib::memory"
header = "include/stxlib/memory.hpp"
anchor = "namespace stxlib::memory {"
keys = { manifest = "stxlib::memory" }
thread = "any"
identity = { kind = "block address: the start of a block from allocate, not yet released", stale = "requirement" }

# The block engine's view of stxlib::memory (IC2): each slot keeps the
# blocks allocate hands out, each filled with its own byte, so a block that
# overlaps another or is written by the allocator breaks the pattern.
[engine]
object = "::stxlib_ic::inputs::MemoryBlocks"
includes = ["stxlib/memory.hpp", "ic/engine/ic_inputs.hpp"]
make = "default"
invariants = ["object.intact()"]

[checks]
path = "src/state/memory_ic_checks.hpp"
namespace = "stxlib::detail::ic::memory"
includes = ["stxlib/types.hpp"]
used_in = ["src/state/allocator.cpp"]

[[call]]
name = "backend"
kind = "free"
declarations = ["[[nodiscard]] Backend backend() noexcept;"]
engine = { needs = "none", result_type = "stxlib::memory::Backend" }

[[call]]
name = "tags_checked"
kind = "free"
declarations = ["[[nodiscard]] bool tags_checked() noexcept;"]
engine = { needs = "none" }

[[call]]
name = "allocate"
kind = "free"
declarations = ["[[nodiscard]] STXLIB_NO_UNWIND void* allocate(usize size, usize alignment) noexcept;"]
parameters = { alignment = "usize" }
requires = [
  { holds = "power_of_two(alignment)", refuses = "null" },
]
fails = [{ failure = "exhausted", when = "memory is exhausted, or the size is not representable with the alignment's bookkeeping: a null result" }]
returns = { type = "void*", owns = "caller" }
engine = { invoke = "object.keep(::stxlib::memory::allocate(size, alignment), size)", needs = "live", draws = { size = "u32" }, ranges = { size = "[0, 65536]", alignment = "[1, 4096]" }, result_type = "void*", failed_when = "result == nullptr", expect = ["(reinterpret_cast<stxlib::uptr>(result) & (alignment - 1)) == 0"] }

[[call]]
name = "release"
kind = "free"
declarations = ["STXLIB_NO_UNWIND void release(void* address) noexcept;"]
transfers = [{ what = "the block", from = "caller", to = "the allocator" }]
engine = { invoke = "object.release_at(which)", needs = "live", draws = { which = "u32" }, result_type = "bool", expect = ["result"] }
