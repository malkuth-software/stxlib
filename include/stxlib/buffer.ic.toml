# Behavioural constraints of stxlib::Buffer (buffer.hpp), the IC declaration
# (template_harness docs/ic_declarations.md; STXlib's project file is
# tools/ic/project.toml). Edit this file, then run
#   python3 -B tools/ic_declarations.py generate --config tools/ic/project.toml

schema = 1
component = "Buffer"
namespace = "stxlib"
header = "include/stxlib/buffer.hpp"
anchor = "class Buffer final {"
keys = { manifest = "stxlib::Buffer" }
thread = "owner"

[terms]
count = "usize"

# The block engine's view of a Buffer (IC2): a Buffer of u64 per slot.
[engine]
object = "stxlib::Buffer<stxlib::u64>"
includes = ["stxlib/buffer.hpp", "ic/engine/ic_inputs.hpp"]
make = "default"
observe = { count = "object.count()" }

[checks]
path = "include/stxlib/detail/ic/buffer_checks.hpp"
namespace = "stxlib::detail::ic::buffer"
includes = ["stxlib/types.hpp"]

[[call]]
name = "allocate_zeroed"
kind = "static"
declarations = ["[[nodiscard]] static OperationResult<Buffer> allocate_zeroed(const usize count) noexcept"]
parameters = { count = "usize" }
fails = [
  { failure = "limit_exceeded", when = "count elements' bytes are not representable" },
  { failure = "out_of_memory", when = "the allocator refuses" },
]
returns = { type = "Buffer", owns = "caller" }
engine = { ranges = { count = "[0, 4096]" }, ensures = ["count = count"], expect = ["::stxlib_ic::inputs::all_zero(object.view())"] }

[[call]]
name = "copy"
declarations = ["[[nodiscard]] OperationResult<Buffer> copy() const noexcept"]
fails = [{ failure = "out_of_memory", when = "the allocator refuses" }]
returns = { type = "Buffer", owns = "caller" }
engine = { expect = ["(*made.value()).count() == object.count()"] }

[[call]]
name = "view"
declarations = ["[[nodiscard]] View<Element> view() const& noexcept"]
returns = { borrows = "self", until = ["release", "a move from the buffer", "its destruction"] }
engine = { result_type = "stxlib::View<stxlib::u64>", expect = ["result.count() == count"] }

[[call]]
name = "mutable_view"
declarations = ["[[nodiscard]] MutableView<Element> mutable_view() & noexcept"]
returns = { borrows = "self", until = ["release", "a move from the buffer", "its destruction"] }
engine = { result_type = "stxlib::MutableView<stxlib::u64>", expect = ["result.count() == count"] }

[[call]]
name = "operator[]"
id = "element"
declarations = [
  "[[nodiscard]] Element& operator[](const usize index) noexcept",
  "[[nodiscard]] const Element& operator[](const usize index) const noexcept",
]
parameters = { index = "usize" }
requires = [
  { holds = "index < count", refuses = "requirement", message = "Buffer: index out of range", check = "element_index" },
]
returns = { borrows = "self", until = ["release", "a move from the buffer", "its destruction"] }

[[call]]
name = "release"
declarations = ["void release() noexcept"]
engine = { ensures = ["count = 0"] }
