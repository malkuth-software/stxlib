# Behavioural constraints of stxlib::fft::Plan32 (fft.hpp), the IC
# declaration (template_harness docs/ic_declarations.md; STXlib's project
# file is tools/ic/project.toml). Edit this file, then run
#   python3 -B tools/ic_declarations.py generate --config tools/ic/project.toml
#
# input_count and output_count are the views' counts; mode is Mode's value.
# Not declared: the refusal of input, output and work that overlap (a
# relation of addresses, which the clause language does not state; fft_tests
# and fft_walk_tests cover it).

schema = 1
component = "Plan32"
namespace = "stxlib::fft"
header = "include/stxlib/fft.hpp"
anchor = "class Plan32 final {"
keys = { manifest = "stxlib::fft::Plan32" }
thread = "owner"
states = ["empty", "ready"]
initial = "empty"
state_query = { call = "empty", observes = { empty = "true", ready = "false" } }

[terms]
size = "usize"
bins = "usize"
work_size = "usize"

[constants]
max_size = { cpp = "::stxlib::fft::max_size", type = "usize" }

[checks]
path = "src/algorithms/fft/plan32_ic_checks.hpp"
namespace = "stxlib::detail::ic::fft_plan32"
includes = ["stxlib/fft.hpp", "stxlib/types.hpp"]
used_in = ["src/algorithms/fft/plan.cpp"]

# The states as conditions over the plan's members (the IC4 deducer reads
# rfft and irfft against them).
[represents]
states = { empty = "state_ == nullptr", ready = "state_ != nullptr" }

# The block engine's view of a plan (IC2): an empty plan per slot; the
# transforms read a two-tone signal and a small spectrum.
[engine]
object = "stxlib::fft::Plan32"
includes = ["stxlib/fft.hpp", "ic/engine/ic_inputs.hpp"]
make = "default"
observe = { size = "object.size()", bins = "object.bins()", work_size = "object.work_size()" }

[[call]]
name = "make"
kind = "static"
thread = "any"
declarations = ["[[nodiscard]] static OperationResult<Plan32> make(usize size, Mode mode) noexcept;"]
parameters = { requested = "usize", mode = "u8" }
requires = [
  { holds = "mode <= 2", refuses = "failure:invalid_argument", check = "make_mode" },
  { holds = "requested <= max_size", refuses = "failure:limit_exceeded", check = "make_size_limit" },
  { holds = "power_of_two(requested) and (requested >= 4 or (mode == 1 and requested >= 2))", refuses = "failure:invalid_argument", check = "make_size_shape" },
  { holds = "mode != 2", refuses = "failure:unsupported", check = "make_float32_mode" },
]
fails = [{ failure = "out_of_memory", when = "the plan's state or tables" }]
returns = { type = "Plan32", state = "ready", owns = "caller" }
engine = { invoke = "Object::make(requested, static_cast<::stxlib::fft::Mode>(mode))", ranges = { requested = "[2, 4096]", mode = "[0, 1]" }, ensures = ["size = requested"] }

[[call]]
name = "empty"
declarations = ["[[nodiscard]] bool empty() const noexcept;"]

[[call]]
name = "size"
declarations = ["[[nodiscard]] usize size() const noexcept;"]
engine = { result_type = "stxlib::usize", expect = ["result == size"] }

[[call]]
name = "bins"
declarations = ["[[nodiscard]] usize bins() const noexcept;"]
engine = { result_type = "stxlib::usize", expect = ["result == bins"] }

[[call]]
name = "rfft"
declarations = ["[[nodiscard]] OperationStatus rfft(View<float> input, MutableView<Complex32> output) noexcept;"]
in = ["ready"]
outside = { empty = "failure:invalid_argument" }
parameters = { input_count = "usize", output_count = "usize" }
requires = [
  { holds = "input_count == size", refuses = "failure:invalid_argument", check = "rfft_input" },
  { holds = "output_count == bins", refuses = "failure:invalid_argument", check = "rfft_output" },
]
engine = { invoke = "object.rfft(::stxlib_ic::inputs::samples<float>(input_count), ::stxlib_ic::inputs::spectrum_output<::stxlib::fft::Complex32>(output_count))", assume = ["input_count <= ::stxlib_ic::inputs::fft_capacity", "output_count <= ::stxlib_ic::inputs::fft_capacity"], expect = ["::stxlib_ic::inputs::spectrum_finite<::stxlib::fft::Complex32>(output_count)"] }

[[call]]
name = "irfft"
declarations = ["[[nodiscard]] OperationStatus irfft(View<Complex32> input, MutableView<float> output) noexcept;"]
in = ["ready"]
outside = { empty = "failure:invalid_argument" }
parameters = { input_count = "usize", output_count = "usize" }
requires = [
  { holds = "input_count == bins", refuses = "failure:invalid_argument", check = "irfft_input" },
  { holds = "output_count == size", refuses = "failure:invalid_argument", check = "irfft_output" },
]
engine = { invoke = "object.irfft(::stxlib_ic::inputs::spectrum<::stxlib::fft::Complex32>(input_count), ::stxlib_ic::inputs::sample_output<float>(output_count))", assume = ["input_count <= ::stxlib_ic::inputs::fft_capacity", "output_count <= ::stxlib_ic::inputs::fft_capacity"], expect = ["::stxlib_ic::inputs::samples_finite<float>(output_count)"] }

[[call]]
name = "magnitude"
declarations = ["[[nodiscard]] OperationStatus magnitude(View<float> input, MutableView<float> output) noexcept;"]
in = ["ready"]
outside = { empty = "failure:invalid_argument" }
parameters = { input_count = "usize", output_count = "usize" }
requires = [
  { holds = "input_count == size", refuses = "failure:invalid_argument", check = "magnitude_input" },
  { holds = "output_count == bins", refuses = "failure:invalid_argument", check = "magnitude_output" },
]
fails = [{ failure = "unsupported", when = "the plan's mode is not plain" }]
engine = { invoke = "object.magnitude(::stxlib_ic::inputs::samples<float>(input_count), ::stxlib_ic::inputs::magnitude_output<float>(output_count))", assume = ["input_count <= ::stxlib_ic::inputs::fft_capacity", "output_count <= ::stxlib_ic::inputs::fft_capacity"], expect = ["::stxlib_ic::inputs::magnitudes_finite<float>(output_count)"] }

[[call]]
name = "work_size"
declarations = ["[[nodiscard]] usize work_size() const noexcept;"]
engine = { result_type = "stxlib::usize", expect = ["result == work_size"] }

# The const calls on the caller's workspace: any thread, any number at
# once on one plan.
[[call]]
name = "rfft_with_work"
thread = "any"
declarations = ["[[nodiscard]] OperationStatus rfft_with_work(View<float> input, MutableView<Complex32> output,"]
in = ["ready"]
outside = { empty = "failure:invalid_argument" }
parameters = { input_count = "usize", output_count = "usize", work_count = "usize" }
requires = [
  { holds = "input_count == size", refuses = "failure:invalid_argument", check = "work_rfft_input" },
  { holds = "output_count == bins", refuses = "failure:invalid_argument", check = "work_rfft_output" },
  { holds = "work_count >= work_size", refuses = "failure:invalid_argument", check = "work_rfft_work" },
]
fails = [{ failure = "unsupported", when = "the plan's mode is not plain" }]
engine = { invoke = "object.rfft_with_work(::stxlib_ic::inputs::samples<float>(input_count), ::stxlib_ic::inputs::spectrum_output<::stxlib::fft::Complex32>(output_count), ::stxlib_ic::inputs::work<float>(work_count))", assume = ["input_count <= ::stxlib_ic::inputs::fft_capacity", "output_count <= ::stxlib_ic::inputs::fft_capacity", "work_count <= ::stxlib_ic::inputs::work_capacity"], expect = ["::stxlib_ic::inputs::spectrum_finite<::stxlib::fft::Complex32>(output_count)"] }

[[call]]
name = "irfft_with_work"
thread = "any"
declarations = ["[[nodiscard]] OperationStatus irfft_with_work(View<Complex32> input, MutableView<float> output,"]
in = ["ready"]
outside = { empty = "failure:invalid_argument" }
parameters = { input_count = "usize", output_count = "usize", work_count = "usize" }
requires = [
  { holds = "input_count == bins", refuses = "failure:invalid_argument", check = "work_irfft_input" },
  { holds = "output_count == size", refuses = "failure:invalid_argument", check = "work_irfft_output" },
  { holds = "work_count >= work_size", refuses = "failure:invalid_argument", check = "work_irfft_work" },
]
fails = [{ failure = "unsupported", when = "the plan's mode is not plain" }]
engine = { invoke = "object.irfft_with_work(::stxlib_ic::inputs::spectrum<::stxlib::fft::Complex32>(input_count), ::stxlib_ic::inputs::sample_output<float>(output_count), ::stxlib_ic::inputs::work<float>(work_count))", assume = ["input_count <= ::stxlib_ic::inputs::fft_capacity", "output_count <= ::stxlib_ic::inputs::fft_capacity", "work_count <= ::stxlib_ic::inputs::work_capacity"], expect = ["::stxlib_ic::inputs::samples_finite<float>(output_count)"] }

[[call]]
name = "magnitude_with_work"
thread = "any"
declarations = ["[[nodiscard]] OperationStatus magnitude_with_work(View<float> input, MutableView<float> output,"]
in = ["ready"]
outside = { empty = "failure:invalid_argument" }
parameters = { input_count = "usize", output_count = "usize", work_count = "usize" }
requires = [
  { holds = "input_count == size", refuses = "failure:invalid_argument", check = "work_magnitude_input" },
  { holds = "output_count == bins", refuses = "failure:invalid_argument", check = "work_magnitude_output" },
  { holds = "work_count >= work_size", refuses = "failure:invalid_argument", check = "work_magnitude_work" },
]
fails = [{ failure = "unsupported", when = "the plan's mode is not plain" }]
engine = { invoke = "object.magnitude_with_work(::stxlib_ic::inputs::samples<float>(input_count), ::stxlib_ic::inputs::magnitude_output<float>(output_count), ::stxlib_ic::inputs::work<float>(work_count))", assume = ["input_count <= ::stxlib_ic::inputs::fft_capacity", "output_count <= ::stxlib_ic::inputs::fft_capacity", "work_count <= ::stxlib_ic::inputs::work_capacity"], expect = ["::stxlib_ic::inputs::magnitudes_finite<float>(output_count)"] }
