[[obligation]]
id = "summary_scan"
statement = "The refill's scan clears a summary bit only for a word with no free block."
given = ["Z & ~S == 0", "low(S) & Z == 0", "S_after == S & (S - 1)", "Z_after == Z"]
shows = "Z_after & ~S_after == 0"
