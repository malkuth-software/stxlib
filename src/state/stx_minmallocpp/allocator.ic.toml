id = "count_collect"
statement = "collect keeps the page's counts and never takes live below zero, so live_count never stops."
given = ["SF + SR + SH == capacity", "live == SH + SR", "F & released == 0", "released == R", "R_after == 0", "F_after == F | released", "H_after == H", "SF_after == SF - pop(F) + pop(F_after)", "SR_after == SR - pop(R) + pop(R_after)", "SH_after == SH", "live_after == live - pop(released)", "SR >= pop(R)", "SH >= 0"]
