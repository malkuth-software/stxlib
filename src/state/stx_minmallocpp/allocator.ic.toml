[[obligation]]
id = "refusal_reads_nothing"
statement = "A release of an address that is not the start of a live block is refused without reading or writing the address or anything near it."
premises = ["the region's metadata (slice heads, page records, free and remote words: the slices below first_data_slice) and the directory are not the block or its neighbours (layout.hpp, page.hpp)"]
untouched = ["address", "value"]
paths = [
  "src/state/stx_minmallocpp/allocator.cpp: release: Release::refused",
  "src/state/stx_minmallocpp/allocator.cpp: release_with: Release::refused",
  "src/state/stx_minmallocpp/allocator.cpp: release_common: Release::refused",
  "src/state/stx_minmallocpp/allocator.cpp: release_general: Release::refused",
  "src/state/stx_minmallocpp/region.cpp: release_huge: return false",
]
metadata = ["slice_heads", "page_metas", "free_words", "remote_words", "directory"]

# The page counter's invariant, step by step (IC4): for every page, the free
# bits of its words and its live count together are its capacity,
#   sum + live == capacity, where sum is the sum over its words of pop(free[w]).
# Each lemma is one step that changes them, read from the source it names;
# the deducer proves it from its givens with sxv's algebra (finite sums
# updated at one word, popcount laws). Together with the page's making they
# give the invariant for every page_whole check (page.hpp), relative to the
# premises: one thread at a time in each step (each segment between step
# marks atomic, as page_protocol assumes), and the words updated being the
# page's own.
[[obligation]]
id = "page_count_take"
statement = "take_from keeps a page's count: the lowest free bit leaves the word and live grows by one."
method = "sxv's: the sum updated at one word; pop(x & (x - 1)) = pop(x) - 1 for x != 0"
premises = ["take_from runs on a non-zero word (its caller loaded it and found it non-zero)", "the step is atomic (between step marks)"]
given = ["sum + live == capacity", "word != 0", "sum_after == sum - pop(word) + pop(word & (word - 1))", "live_after == live + 1"]
shows = "sum_after + live_after == capacity"
sources = ["src/state/stx_minmallocpp/heap.hpp: cell.store(word & (word - 1), std::memory_order_relaxed);", "src/state/stx_minmallocpp/heap.hpp: page.live = page.live + 1;"]

[[obligation]]
id = "page_count_release"
statement = "The owner's release keeps a page's count and never takes live below zero: the block's bit joins its word and live falls by one."
method = "sxv's: the sum updated at one word; pop(a | b) = pop(a) + pop(b) for disjoint a and b; pop of one bit is 1"
premises = ["the block is live (its bit is clear in the word, checked by the integrity stop before the store)", "a live block counts in live, so live >= 1", "the step is atomic (between step marks)"]
given = ["sum + live == capacity", "known & bit == 0", "single_bit(bit)", "live >= 1", "sum_after == sum - pop(known) + pop(known | bit)", "live_after == live - 1"]
shows = "sum_after + live_after == capacity and live_after >= 0"
sources = ["src/state/stx_minmallocpp/allocator.cpp: if ((known & bit) != 0) {", "src/state/stx_minmallocpp/allocator.cpp: free_cell.store(known | bit, std::memory_order_relaxed);", "src/state/stx_minmallocpp/allocator.cpp: page.live = page.live - 1;"]

[[obligation]]
id = "page_count_collect"
statement = "Collecting the remotely released blocks of a word keeps a page's count and never takes live below zero."
method = "sxv's: the sum updated at one word; pop(a | b) = pop(a) + pop(b) for disjoint a and b"
premises = ["the integrity stops before the store end the process when the words overlap or the count exceeds live", "the step is atomic (between step marks)"]
given = ["sum + live == capacity", "known & released == 0", "pop(released) <= live", "sum_after == sum - pop(known) + pop(known | released)", "live_after == live - pop(released)"]
shows = "sum_after + live_after == capacity and live_after >= 0"
sources = ["src/state/stx_minmallocpp/page.hpp: if ((known & released) != 0) integrity_stop(Integrity::released_twice);", "src/state/stx_minmallocpp/page.hpp: if (count > page.live) integrity_stop(Integrity::live_count);", "src/state/stx_minmallocpp/page.hpp: free_cells[word].store(known | released, std::memory_order_relaxed);", "src/state/stx_minmallocpp/page.hpp: page.live = page.live - count;"]

[[obligation]]
id = "page_count_made"
statement = "A page made with its blocks free starts with its count: its full words and its last word's low bits are its capacity, and live is zero."
method = "sxv's: a finite sum split at its last term; pop of all 64 bits is 64; pop(2^r - 1) = r"
premises = ["the plan's words are the capacity in 64-bit words, rounded up, so every word but the last is full (remaining >= 64) and the last holds 1 to 64 blocks", "a word with remaining >= 64 is u64_max, the last 2^remaining - 1 (or u64_max when remaining is 64)"]
given = ["words >= 1", "remaining == capacity - 64 * (words - 1)", "remaining >= 1", "remaining <= 64", "sum == 64 * (words - 1) + pop(2^remaining - 1)", "live == 0"]
shows = "sum + live == capacity"
sources = ["src/state/stx_minmallocpp/heap.cpp: const usize remaining = plan.capacity - word * word_bits;", "src/state/stx_minmallocpp/heap.cpp: free_bits = remaining >= word_bits ? u64_max : (static_cast<u64>(1) << remaining) - 1;", "src/state/stx_minmallocpp/heap.cpp: page.live = plan.blocks_free ? 0 : static_cast<u32>(plan.capacity);"]
