# STXlib CI (owner, 2026-11-13: "Add CI"; notes decisions/2026-11-13-survey-round-4.md).
# Modelled on GUI.Forms' native.yml and native-platform.yml, much reduced:
# one job per platform, each building its modes one after another, so a run
# costs three jobs. The M4 integrator covers macOS (seven builds per fold);
# CI covers the platforms the M4 does not host.
#
# Toolchain pin: LLVM 22.1.8 (the product pin, FORWARD_PROGRAMME section 4).
# What each runner can give, and the deviation it carries:
# - linux-glibc: apt.llvm.org's llvm-toolchain-noble-22 repository, as
#   GUI.Forms installs it. It serves only the newest 22.x point release, so
#   the job runs whatever 22.1.x that is and prints it; it is not pinned to
#   22.1.8.
# - linux-musl: the clang22 package of Alpine 3.24, 22.1.3-r0 (recorded
#   deviation: not 22.1.8).
# - windows: MSYS2's CLANG64 repository carries only its current LLVM.
#   GUI.Forms gets an exact pin by packaging the toolchain once and restoring
#   that package; STXlib does not have such a package yet. The job installs
#   MSYS2's current clang, prints the version, and warns when it is not
#   22.1.8.
# Every job prints the compiler version before it builds.
# Actions: actions/checkout v7 (v7.0.1, 2026-07-20) and actions/cache v6
# (v6.1.0, 2026-06-26), both on node24 (their action.yml), replacing v4 on
# the deprecated Node 20.
name: STXlib CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stxlib-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 300M
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
jobs:
  linux-glibc:
    # Debug (shadowing and allocation tags on), ASan+UBSan and TSan, with
    # libc++ (the Linux profile's C++ library), then the advisory clang-tidy.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CC: clang-22
      CXX: clang++-22
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 22 from apt.llvm.org
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.asc" /usr/share/keyrings/apt-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-22 clang-tidy-22 lld-22 \
            libc++-22-dev libc++abi-22-dev libclang-rt-22-dev ninja-build ccache
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Compiler
        run: |
          clang++-22 --version | head -1
          clang++-22 --version | head -1 | grep -q ' 22\.1\.8' || echo "::warning::LLVM is not 22.1.8 on linux-glibc: $(clang++-22 --version | head -1)"
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v1-linux-glibc-${{ github.sha }}
          restore-keys: ccache-v1-linux-glibc-
      # Newer runner kernels use more mmap randomisation bits than older TSan
      # runtimes accept; 28 is what they expect.
      - name: Allow TSan's memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Debug
        run: |
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ -DCMAKE_SHARED_LINKER_FLAGS=-stdlib=libc++
          cmake --build build-debug --parallel 4
          ctest --test-dir build-debug --output-on-failure --parallel 3 --timeout 1800
      - name: ASan+UBSan
        run: |
          flags="-stdlib=libc++ -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          cmake -S . -B build-asan-ubsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g" \
            "-DCMAKE_CXX_FLAGS=$flags" "-DCMAKE_EXE_LINKER_FLAGS=$flags" "-DCMAKE_SHARED_LINKER_FLAGS=$flags"
          cmake --build build-asan-ubsan --parallel 4
          ctest --test-dir build-asan-ubsan --output-on-failure --parallel 3 --timeout 1800
      - name: TSan
        run: |
          flags="-stdlib=libc++ -fsanitize=thread -fno-omit-frame-pointer -g"
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS=-fsanitize=thread -fno-omit-frame-pointer -g" \
            "-DCMAKE_CXX_FLAGS=$flags" "-DCMAKE_EXE_LINKER_FLAGS=$flags" "-DCMAKE_SHARED_LINKER_FLAGS=$flags"
          cmake --build build-tsan --parallel 4
          ctest --test-dir build-tsan --output-on-failure --parallel 3 --timeout 1800
      # Advisory only (.clang-tidy): reported, never failing the job.
      - name: clang-tidy (advisory, misc-const-correctness)
        if: always()
        continue-on-error: true
        run: |
          run-clang-tidy-22 -p build-debug -j 4 -quiet "$PWD/(src|tests)/" > clang-tidy.log 2>&1 || true
          echo "findings: $(grep -c 'warning:' clang-tidy.log) warnings, $(grep -c 'error:' clang-tidy.log) errors"
          grep -E 'warning:|error:' clang-tidy.log | sed "s|$PWD/||" | sort -u | head -60
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

  linux-musl:
    # Plain (Release) and Debug in an Alpine container, with libc++, LLVM's
    # unwinder and compiler-rt, as Alpine 3.24 packages them (main, all
    # 22.1.3-r0, pkgs.alpinelinux.org: libc++, libc++-dev, libc++-static,
    # llvm-libunwind, llvm-libunwind-dev, compiler-rt). The first run linked
    # with -stdlib=libc++ alone and failed at CMake's compiler check.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: alpine:3.24
    env:
      CC: clang
      CXX: clang++
      LINK: -stdlib=libc++ -rtlib=compiler-rt -unwindlib=libunwind
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Install clang 22 and libc++ from Alpine
        run: |
          apk add --no-cache build-base cmake ninja python3 git ccache tar \
            clang22 libc++-dev libc++-static llvm-libunwind-dev compiler-rt
          ln -sf "$(command -v clang-22 || ls /usr/lib/llvm22/bin/clang)" /usr/local/bin/clang
          ln -sf "$(command -v clang++-22 || ls /usr/lib/llvm22/bin/clang++)" /usr/local/bin/clang++
      - uses: actions/checkout@v7
      - name: Compiler
        run: |
          clang++ --version | head -1
          clang++ --version | head -1 | grep -q ' 22\.1\.8' || echo "::warning::LLVM is not 22.1.8 on linux-musl: $(clang++ --version | head -1)"
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v1-linux-musl-${{ github.sha }}
          restore-keys: ccache-v1-linux-musl-
      - name: Plain
        run: |
          cmake -S . -B build-plain -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ "-DCMAKE_EXE_LINKER_FLAGS=$LINK" "-DCMAKE_SHARED_LINKER_FLAGS=$LINK"
          cmake --build build-plain --parallel 4
          ctest --test-dir build-plain --output-on-failure --parallel 3 --timeout 1800
      - name: Debug
        run: |
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ "-DCMAKE_EXE_LINKER_FLAGS=$LINK" "-DCMAKE_SHARED_LINKER_FLAGS=$LINK"
          cmake --build build-debug --parallel 4
          ctest --test-dir build-debug --output-on-failure --parallel 3 --timeout 1800
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

  windows:
    # MSYS2 CLANG64 with libc++ linked statically into every module (-static),
    # as GUI.Forms builds; Debug and plain. Two-module case 2 (a library gate
    # over an executable throw) runs here for the first time: its output says
    # which kind Windows reports.
    runs-on: windows-2025
    timeout-minutes: 50
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-ccache
            mingw-w64-clang-x86_64-python
      - name: Compiler
        run: |
          clang++ --version | head -1
          clang++ --version | head -1 | grep -q ' 22\.1\.8' || echo "::warning::LLVM is not 22.1.8 on windows (MSYS2 carries only its current LLVM): $(clang++ --version | head -1)"
      - name: Configure compiler cache
        run: |
          echo "CCACHE_DIR=$(cygpath -m "$PWD/.ccache")" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$(cygpath -m "$PWD")" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v1-windows-${{ github.sha }}
          restore-keys: ccache-v1-windows-
      - name: Debug
        run: |
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-static -DCMAKE_SHARED_LINKER_FLAGS=-static
          cmake --build build-debug --parallel 4
          ctest --test-dir build-debug --output-on-failure --parallel 3 --timeout 1800
      - name: Two-module case 2 (the Windows result)
        if: always()
        run: ctest --test-dir build-debug -R '^stxlib_two_module_tests$' -V | grep -i -E 'case 2|kind|invalid_argument|foreign_exception' | head -20 || true
      - name: Plain
        run: |
          cmake -S . -B build-plain -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-static -DCMAKE_SHARED_LINKER_FLAGS=-static
          cmake --build build-plain --parallel 4
          ctest --test-dir build-plain --output-on-failure --parallel 3 --timeout 1800
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
