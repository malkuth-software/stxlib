# C1 step S4, root slot A's /etc/stx/appliance.conf (appliance/vm/c1_s4.sh):
# a memory /var (the root is read-only), DHCP on every Ethernet interface,
# one service. poweroff_delay: see s3-appliance.conf.
[init]
run /sbin/sysctl kern.shutdown.poweroff_delay=0
run /sbin/mount -t tmpfs -o size=16m tmpfs /var
run /bin/sh -c "mkdir -p /var/run /var/db /var/log && mkdir -p -m 555 /var/empty"
run /bin/sh -c "for i in $(/sbin/ifconfig -l ether); do /sbin/dhclient -b -l /var/db/dhclient.leases.$i $i; done"
start sleeper

[service-sleeper]
command = /bin/sleep 3600
restart = always
