# C1 step S5 test configuration (appliance/vm/c1_s5.sh), installed as
# /etc/stx/appliance.conf: three services. "sleeper" ends at SIGTERM;
# "stubborn" ignores SIGTERM (as does its sleep, which inherits the ignored
# disposition), so only the shim's SIGKILL ends it; "trigger" on its first
# life (no terminate done yet) asks the supervisor for a terminate
# (SIGUSR1) and is itself terminated; restarted, it kills the supervisor
# (SIGKILL), which the shim's death watch reports and PID 1 respawns.
# poweroff_delay: see s3-appliance.conf.
[init]
start sleeper
start stubborn
start trigger
run /sbin/sysctl kern.shutdown.poweroff_delay=0

[service-sleeper]
command = /bin/sleep 3600
restart = always

[service-stubborn]
command = /bin/sh -c "trap '' TERM; while :; do /bin/sleep 1; done"
restart = on-failure

[service-trigger]
command = /bin/sh -c "/bin/sleep 1; if [ $(/sbin/sysctl -n kern.stxshim.terminations) = 0 ]; then /bin/pkill -USR1 -x stxsupervisor; /bin/sleep 30; else /bin/pkill -KILL -x stxsupervisor; fi"
restart = on-failure
