# C1 step S2 test configuration (appliance/vm/c1_s2.sh), installed as
# /etc/stx/appliance.conf. Every command kind once, with the outcomes the
# scenario expects noted per line.
[system]
hostname = stx-vm

# The kernel waits kern.shutdown.poweroff_delay (default 5000 ms) before
# powering off, for disks' write caches to be flushed
# (sys/kern/kern_shutdown.c:976-999). A VM has no such cache to wait for;
# the delay is 0 here. Real hardware is reviewed in C3. The format's set
# command sets an environment variable, so the sysctl is run as a program.
[init]
wait-for device /dev/gpt/rootfs 1000
if-present device /dev/gpt/efiesp mount msdosfs /dev/gpt/efiesp /boot/efi ro
set GREETING "hello from init"
run /bin/sh -c "echo INITRUN $GREETING"
if-present file /nonexistent run /usr/bin/false
run /usr/bin/false
start web
wait-for file /nonexistent 100
run /sbin/sysctl kern.shutdown.poweroff_delay=0

# Since S3 a start must name a service the file defines.
[service-web]
command = /bin/sleep 3600
restart = never
