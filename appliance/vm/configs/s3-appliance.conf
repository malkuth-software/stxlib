# C1 step S3 test configuration (appliance/vm/c1_s3.sh), installed as
# /etc/stx/appliance.conf: two services started by the init section, one
# that fails at once (restarted with back-off) and one that runs until the
# shutdown stops it.
# The kernel waits kern.shutdown.poweroff_delay (default 5000 ms) before
# powering off, for disks' write caches to be flushed
# (sys/kern/kern_shutdown.c:976-999). A VM has no such cache to wait for;
# the delay is 0 here. Real hardware is reviewed in C3. The format's set
# command sets an environment variable, so the sysctl is run as a program.
[init]
start flaky
start sleeper
run /bin/sh -c "echo INITRUN services started"
run /sbin/sysctl kern.shutdown.poweroff_delay=0

[service-flaky]
command = /bin/sh -c "echo FLAKYRUN; exit 3"
restart = on-failure

[service-sleeper]
command = /bin/sleep 3600
directory = /tmp
restart = always
