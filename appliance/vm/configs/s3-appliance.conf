# C1 step S3 test configuration (appliance/vm/c1_s3.sh), installed as
# /etc/stx/appliance.conf: two services started by the init section, one
# that fails at once (restarted with back-off) and one that runs until the
# shutdown stops it.
[init]
start flaky
start sleeper
run /bin/sh -c "echo INITRUN services started"

[service-flaky]
command = /bin/sh -c "echo FLAKYRUN; exit 3"
restart = on-failure

[service-sleeper]
command = /bin/sleep 3600
directory = /tmp
restart = always
