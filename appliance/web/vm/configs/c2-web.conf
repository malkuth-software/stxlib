# C2 web scenario configuration (appliance/web/vm/c2_web.sh), installed as
# /etc/stx/appliance.conf in a test VM: the web service with the operate
# control channel, and one more service for it to stop and start. The test
# VM's user-mode network forwards only the guest's port 22 (boot_timing.py,
# --ssh-forward-port), so stxweb listens there; on the appliance it is 443.
# The VM's root is UFS and writable once remounted; /user is a plain
# directory here (the appliance mounts its FAT32 partition there), where the
# supervisor keeps the user configuration's turn files (/user/stx/config.0
# and .1). The web service's password and identity live in /var/db/stxweb,
# so they survive the reboot the scenario asks for.
[init]
run /sbin/sysctl kern.shutdown.poweroff_delay=0
run /sbin/mount -u -o rw /
run /bin/mkdir -p /user/stx /var/db/stxweb
run /sbin/dhclient -b vtnet0
start sleeper
start web

[service-sleeper]
command = /bin/sleep 3600
restart = always

[service-web]
command = /usr/sbin/stxweb --port 22 --state /var/db/stxweb --assets /usr/share/stx/web
restart = always
control = operate
