# /etc/stx/appliance.conf -- the factory configuration of every board's
# image (C2; appliance/C2_DESIGN.md, "Normal running"), in both root slots.
# Read by the supervisor (init section, services, targets) and by stxnet
# (system and network sections). The web configuration (sc2) writes its
# own version of this file later; until then the unit runs this one.
#
# Normal running: the user and data partitions, a memory /var, Ethernet by
# DHCP, the base system's sshd (key login only; the owner's keys from the
# user partition), one SNTP query at boot, then securelevel 1. No target:
# the image's buyer registers theirs (a target section and a package).

[system]
hostname = stx

[network]
mode = dhcp

[init]
sysctl kern.shutdown.poweroff_delay=0
# The console's keyboard cannot halt, reboot or enter the debugger: only
# the foreground target uses the screen and keyboard (owner answer 15).
if-present device /dev/ttyv0 sysctl kern.vt.kbd_halt=0
if-present device /dev/ttyv0 sysctl kern.vt.kbd_poweroff=0
if-present device /dev/ttyv0 sysctl kern.vt.kbd_reboot=0
if-present device /dev/ttyv0 sysctl kern.vt.kbd_debug=0
if-present device /dev/ttyv0 sysctl kern.vt.kbd_panic=0
mount msdosfs /dev/msdosfs/STXUSER /user rw
run /sbin/fsck_ffs -p /dev/ufs/STXDATA
mount ufs /dev/ufs/STXDATA /data rw
run /sbin/mount -t tmpfs -o size=32m,mode=755 tmpfs /var
run /bin/sh -c "mkdir -p /var/run /var/db /var/log /data/programs /data/targets && mkdir -p -m 555 /var/empty && mkdir -p -m 700 /data/ssh"
run /bin/sh -c "test -f /data/ssh/ssh_host_ed25519_key || /usr/bin/ssh-keygen -q -t ed25519 -N '' -f /data/ssh/ssh_host_ed25519_key"
run /usr/bin/ssh-keygen -l -f /data/ssh/ssh_host_ed25519_key.pub
run /bin/sh -c "if test -f /user/stx/ssh/authorized_keys; then cp /user/stx/ssh/authorized_keys /data/ssh/authorized_keys.new && chmod 600 /data/ssh/authorized_keys.new && mv /data/ssh/authorized_keys.new /data/ssh/authorized_keys; fi"
run /sbin/stxnet /etc/stx/appliance.conf
start sshd
start clock
sysctl kern.securelevel=1

[service-sshd]
command = /usr/sbin/sshd -D -f /etc/stx/sshd_appliance.conf
restart = always

# One SNTP query at boot (owner answer 25), retried with backoff inside
# stxsntp's window until a server answers; the clock is then the
# kernel's own.
[service-clock]
command = /sbin/stxsntp pool.ntp.org
restart = never
