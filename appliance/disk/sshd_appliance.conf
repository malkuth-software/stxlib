# /etc/stx/sshd_appliance.conf -- sshd in normal running (C2), from the
# pinned base, started by appliance.conf as the service "sshd" (-D, so the
# supervisor holds it). Key login only, as root; no passwords, no
# forwarding of any kind. The host key and the authorized keys are on the
# data partition (UFS2, so modes hold and StrictModes stays on);
# appliance.conf makes the key once and copies the owner's
# authorized_keys from the user partition (/user/stx/ssh/authorized_keys,
# where they put it with any computer) at every boot. The second file holds
# the keys the web configuration's [access] section names (ssh-key-1..8):
# the supervisor writes it after the init section at every boot, from the
# user configuration it chose (runtime/supervisor/config/access_keys.h).
Port 22
HostKey /data/ssh/ssh_host_ed25519_key
AuthorizedKeysFile /data/ssh/authorized_keys /data/ssh/authorized_keys.access
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM no
AllowTcpForwarding no
AllowStreamLocalForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
PidFile /var/run/sshd.pid
