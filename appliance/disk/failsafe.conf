# /etc/stx/failsafe.conf -- the failsafe path (C1 step S4; design
# appliance/disk/LAYOUT.md), installed read-only in each root slot. The
# supervisor runs this init section, with the same parser and executor as
# the appliance's, when the appliance cannot come up; then it appends the
# reason to /user/stx/boot.log. Everything comes from the pinned base.
# /var is a small memory file system, since the root is read-only. The host
# key lives on the user partition (FAT keeps no permissions), and is copied
# to /var with mode 600 for sshd; its fingerprint goes to the console.
[init]
mount msdosfs /dev/msdosfs/STXUSER /user rw
run /sbin/mount -t tmpfs -o size=16m tmpfs /var
run /bin/sh -c "mkdir -p /var/run /var/db /var/log /var/stx/ssh /user/stx/ssh && mkdir -p -m 555 /var/empty"
run /bin/sh -c "test -f /user/stx/ssh/ssh_host_ed25519_key || /usr/bin/ssh-keygen -q -t ed25519 -N '' -f /user/stx/ssh/ssh_host_ed25519_key"
run /bin/sh -c "cp /user/stx/ssh/ssh_host_ed25519_key /user/stx/ssh/ssh_host_ed25519_key.pub /var/stx/ssh/ && chmod 600 /var/stx/ssh/ssh_host_ed25519_key"
run /usr/bin/ssh-keygen -l -f /var/stx/ssh/ssh_host_ed25519_key.pub
run /bin/sh -c "for i in $(/sbin/ifconfig -l ether); do /sbin/dhclient -b -l /var/db/dhclient.leases.$i $i; done"
run /usr/sbin/sshd -f /etc/stx/sshd_failsafe.conf
