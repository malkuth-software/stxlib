# /etc/stx/sshd_failsafe.conf -- sshd for the failsafe path (C1 step S4),
# from the pinned base. Key login only, as root; no passwords. The
# authorized keys are the owner's, on the user partition; FAT keeps no
# permissions, hence StrictModes no.
Port 22
HostKey /var/stx/ssh/ssh_host_ed25519_key
AuthorizedKeysFile /user/stx/ssh/authorized_keys
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM no
StrictModes no
PidFile /var/run/sshd.pid
